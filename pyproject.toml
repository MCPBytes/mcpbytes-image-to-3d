[project]
name = "mcpbytes-image-to-3d"
version = "0.1.1"
description = "Turn one image into a textured 3D model (GLB) with Tencent's Hunyuan3D 2.1, on your own GPU. CLI and MCP server."
readme = "README.md"
license = "AGPL-3.0-only AND LicenseRef-Tencent-Hunyuan-3D-2.1-Community"
license-files = [
    "LICENSE",
    "NOTICE",
    "src/mcpbytes_image_to_3d/vendor/hunyuan3d/LICENSE",
    "src/mcpbytes_image_to_3d/vendor/hunyuan3d/Notice.txt",
]
authors = [{ name = "King Of The Hour, LLC" }]
keywords = ["3d", "image to 3d", "glb", "gltf", "hunyuan3d", "mcp", "game assets"]
# numpy 1.26 (the version the vendored Hunyuan3D code runs with) has no wheels for Python 3.13.
requires-python = ">=3.11,<3.13"
# The vendored Hunyuan3D code runs with the libraries it was written for; torch is 2.8 so that
# `uv --torch-backend=auto` finds a CUDA build for current drivers.
dependencies = [
    "mcpbytes-core>=0.1.2,<0.2",
    "mcp>=2.3,<3",
    "pillow>=12.3",
    "numpy==1.26.4",
    "scipy",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "diffusers==0.30.0",
    "transformers==4.46.3",  # 4.46.0 (the hosted pin) is yanked, and uv refuses yanked versions a package depends on
    "accelerate==1.1.1",
    "huggingface-hub==0.30.2",
    "safetensors>=0.4.4",
    "einops==0.8.0",
    "omegaconf==2.3.0",
    "pyyaml>=6",
    "opencv-python-headless>=4.10,<4.12",
    "scikit-image==0.24.0",
    "rembg==2.0.65",
    "onnxruntime==1.22.1",
    "timm==1.0.19",
    "trimesh==4.4.7",
    "xatlas==0.0.11",
    "fast-simplification==0.2.0",
    "DracoPy==2.1.0",
    "ninja",
    "tqdm",
]

[project.scripts]
mcpbytes-image-to-3d = "mcpbytes_image_to_3d.cli:main"

[project.urls]
Homepage = "https://mcpbytes.com"
Source = "https://github.com/MCPBytes/mcpbytes-image-to-3d"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
